    <!-- A CSP NAO mora aqui. Ela e injetada SO NO BUILD por config/csp.ts,

         injeta scripts inline proprios (React Refresh, HMR) que nenhum hash
         fixo cobre, a CSP os bloqueava e o painel nunca montava no preview. -->

    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Dois aplicativos, um código: quem abre /ciclo instala o "Ciclo" (ícone e
      nome próprios, abre direto no checklist); qualquer outra página instala o
      painel. A troca acontece AQUI, antes do app carregar, porque o navegador
      lê estas tags no momento de "Adicionar à tela inicial" — e uma página
      .html separada se mostrou frágil na hospedagem (o publish parou de servi-la).
    -->
    <script>
      (function () {
        if (window.location.pathname.replace(/\/+$/, "") !== "/ciclo") return;
        var set = function (selector, attr, value) {
          var el = document.querySelector(selector);
          if (el) el.setAttribute(attr, value);
        };
        set('link[rel="manifest"]', "href", "/ciclo.webmanifest");
        set('meta[name="apple-mobile-web-app-title"]', "content", "Ciclo");
        set('link[rel="apple-touch-icon"]', "href", "/ciclo-apple-touch-icon.png");
        set('link[rel="icon"]', "href", "/ciclo-icon-192.png");
        document.title = "Ciclo Aceleriq";
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

  <body>
    <div id="root"></div>

    <!--
      Rede de seguranca FORA do codigo do app.

      O painel inteiro (inclusive a auto-recuperacao de versao) vive dentro de um
      arquivo JavaScript moderno. Se o navegador da pessoa for antigo demais para
      ler esse arquivo, ou se o arquivo nao chegar (publicacao saindo neste
      instante, cache velho, rede fraca), nada daquilo roda: a pagina fica preta
      e sem explicacao, e atualizar mil vezes nao adianta. Tudo abaixo e escrito
      em JavaScript antigo de proposito, para funcionar em QUALQUER navegador:

      1. #app-boot: a tela nunca fica preta. Meio segundo depois de abrir, se o
         painel ainda nao montou, aparece a marca com "Abrindo o painel".
      2. Arquivo do painel que nao baixou: recarrega sozinho ate duas vezes
         furando o cache; depois avisa com botao.
      3. Erro de leitura (navegador antigo) ou erro ao iniciar: aviso na hora,
         com o detalhe tecnico para mandar para a Aceleriq.
      4. Link aberto dentro do WhatsApp, Instagram ou Gmail: dica para abrir
         no navegador de verdade.
    -->
    <style>
      #app-boot{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483646;background:#0D0D0D;color:#F5F5F5;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;-webkit-animation:app-boot-in .01s .5s both;animation:app-boot-in .01s .5s both}
      @-webkit-keyframes app-boot-in{to{display:block}}
      @keyframes app-boot-in{to{display:block}}
      #app-boot .app-boot-inner{position:absolute;top:40%;left:0;right:0}
      #app-boot .app-boot-mark{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin:0 0 14px}
      #app-boot .app-boot-mark span{color:#00FF66}
      #app-boot .app-boot-bar{width:120px;height:3px;margin:0 auto;border-radius:3px;background:rgba(245,245,245,0.12);overflow:hidden}
      #app-boot .app-boot-bar i{display:block;width:40%;height:100%;background:#00FF66;-webkit-animation:app-boot-slide 1.1s ease-in-out infinite;animation:app-boot-slide 1.1s ease-in-out infinite}
      @-webkit-keyframes app-boot-slide{0%{-webkit-transform:translateX(-100%)}100%{-webkit-transform:translateX(260%)}}
      @keyframes app-boot-slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
      #app-boot .app-boot-text{font-size:13px;color:rgba(245,245,245,0.6);margin:14px 0 0}
    </style>
    <div id="app-boot" aria-hidden="true">
      <div class="app-boot-inner">
        <p class="app-boot-mark">Aceler<span>iq</span></p>
        <div class="app-boot-bar"><i></i></div>
        <p class="app-boot-text">Abrindo o painel...</p>
      </div>
    </div>

    <div id="app-fallback" style="display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;background:#0D0D0D;color:#F5F5F5;font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;overflow:auto;-webkit-overflow-scrolling:touch;">
      <div style="max-width:460px;margin:0 auto;padding-top:10vh;text-align:center;">
        <p id="app-fallback-title" style="font-size:20px;font-weight:700;margin:0 0 12px;">Não foi possível abrir o painel</p>
        <p id="app-fallback-text" style="font-size:14px;line-height:1.6;color:rgba(245,245,245,0.75);margin:0 0 20px;"></p>
        <button id="app-fallback-retry" type="button" style="min-height:48px;padding:14px 28px;border:0;border-radius:12px;background:#00FF66;color:#0D0D0D;font-size:15px;font-weight:700;cursor:pointer;">Tentar novamente</button>
        <p id="app-fallback-hint" style="display:none;font-size:13px;line-height:1.6;color:rgba(245,245,245,0.75);margin:20px 0 0;padding:12px 14px;border:1px solid rgba(0,255,102,0.35);border-radius:12px;text-align:left;"></p>
        <p style="font-size:12px;line-height:1.6;color:rgba(245,245,245,0.45);margin:20px 0 0;">
          Se continuar assim, mande esta tela para a Aceleriq:
        </p>
        <p id="app-fallback-info" style="font-size:11px;line-height:1.5;color:rgba(245,245,245,0.45);word-break:break-word;margin:6px 0 0;"></p>
      </div>
    </div>

    <noscript>
      <div style="position:fixed;top:0;right:0;bottom:0;left:0;background:#0D0D0D;color:#F5F5F5;font-family:system-ui,sans-serif;padding:24px;text-align:center;">
        <p style="font-size:16px;padding-top:12vh;">O painel precisa de JavaScript ativado no navegador para funcionar.</p>
      </div>
    </noscript>

    <script>
      (function () {
        var shown = false;
        var RETRIES_KEY = "aceleriq-boot-retries";

        // O app so termina de montar quando ha conteudo dentro de #root.
        function appMounted() {
          var root = document.getElementById("root");
          return !!(root && root.children && root.children.length > 0);
        }

        function hideBoot() {
          var boot = document.getElementById("app-boot");
          if (boot) boot.style.display = "none";
        }

        // Some assim que o painel aparece (rapido, sem piscar).
        var bootWatch = window.setInterval(function () {
          if (!appMounted()) return;
          window.clearInterval(bootWatch);
          hideBoot();
        }, 150);

        // Link aberto dentro de outro aplicativo (WhatsApp, Instagram, Facebook,
        // Gmail): navegador embutido, muitas vezes velho ou sem armazenamento.
        function insideApp() {
          var ua = String(navigator.userAgent || "");
          return /FBAN|FBAV|FB_IAB|Instagram|WhatsApp|Line\/|Twitter|Snapchat|GSA\/|; wv\)/i.test(ua);
        }

        function retryUrl() {
          var url = window.location.href.split("#")[0];
          url += (url.indexOf("?") < 0 ? "?" : "&") + "v=" + new Date().getTime();
          return url;
        }

        // Recarrega furando o cache e sem service worker antigo no caminho.
        function reload() {
          var done = false;
          var go = function () {
            if (done) return;
            done = true;
            window.location.replace(retryUrl());
          };
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (list) {
                for (var i = 0; i < list.length; i += 1) { try { list[i].unregister(); } catch (e) { /* segue */ } }
                go();
              }, go);
              window.setTimeout(go, 1500);
              return;
            }
          } catch (e) { /* sem service worker: segue */ }
          go();
        }

        // Arquivo do painel nao chegou: tenta de novo sozinho, no maximo duas
        // vezes por aba, para nunca entrar em loop.
        function autoRetry() {
          var count = 0;
          try { count = parseInt(sessionStorage.getItem(RETRIES_KEY) || "0", 10) || 0; } catch (e) { count = 2; }
          if (count >= 2) return false;
          try { sessionStorage.setItem(RETRIES_KEY, String(count + 1)); } catch (e) { return false; }
          reload();
          return true;
        }

        function show(title, text, detail) {
          if (shown) return;
          shown = true;
          hideBoot();
          var box = document.getElementById("app-fallback");
          if (!box) return;
          var titleEl = document.getElementById("app-fallback-title");
          var textEl = document.getElementById("app-fallback-text");
          var hintEl = document.getElementById("app-fallback-hint");
          var infoEl = document.getElementById("app-fallback-info");
          if (titleEl) titleEl.innerHTML = title;
          if (textEl) textEl.innerHTML = text;
          if (hintEl && insideApp()) {
            hintEl.innerHTML = "Este link abriu dentro de outro aplicativo. Toque no menu do canto (três pontinhos ou o ícone de compartilhar) e escolha <b>Abrir no navegador</b> (Chrome ou Safari).";
            hintEl.style.display = "block";
          }
          if (infoEl) infoEl.innerHTML = (detail ? detail + " | " : "") + navigator.userAgent;
          box.style.display = "block";

          // Internet lenta: se o painel terminar de carregar depois do aviso,
          // o aviso sai da frente sozinho em vez de tapar a tela para sempre.
          var watch = window.setInterval(function () {
            if (!appMounted()) return;
            window.clearInterval(watch);
            box.style.display = "none";
            shown = false;
          }, 1000);
        }

        var retry = document.getElementById("app-fallback-retry");
        if (retry) retry.onclick = reload;

        var OLD_BROWSER_TEXT =
          "O navegador deste aparelho está em uma versão antiga e não consegue ler o painel. " +
          "Atualize o Google Chrome (ou o sistema do celular) pela loja de aplicativos, ou tente abrir em outro aparelho.";

        // Navegador sem suporte a modulos (Chrome anterior ao 61, Safari
        // anterior ao 10.1) nunca vai executar o app. Avisa na hora.
        if (!("noModule" in document.createElement("script"))) {
          show("Navegador desatualizado", OLD_BROWSER_TEXT);
          return;
        }

        function textOf(value) {
          if (!value) return "";
          if (value.message) return String(value.message);
          return String(value);
        }

        function isMissingFile(message) {
          return /Importing a module script failed|Failed to fetch dynamically imported module|error loading dynamically imported module|Loading chunk|Load failed|Failed to fetch/i.test(message);
        }

        function failedToStart(message) {
          // Espera um pouco: pode ser so um aviso que nao impede o painel.
          window.setTimeout(function () {
            if (appMounted()) return;
            show(
              "O painel não conseguiu abrir",
              "Aconteceu um erro ao iniciar. Toque em Tentar novamente; se esta tela voltar, mande a foto dela para a Aceleriq.",
              message
            );
          }, 3000);
        }

        window.addEventListener("error", function (event) {
          if (appMounted()) return;
          var target = event && event.target;
          var tag = target && target.tagName ? String(target.tagName).toUpperCase() : "";
          if (tag === "SCRIPT" || tag === "LINK") {
            // Um arquivo do painel nao baixou (publicacao saindo agora, cache
            // velho ou rede instavel).
            if (autoRetry()) return;
            show(
              "Não foi possível baixar o painel",
              "Um arquivo do painel não chegou até aqui. Pode ser a internet oscilando ou uma atualização saindo neste instante. Toque em Tentar novamente.",
              (target && target.src) || (target && target.href) || ""
            );
            return;
          }
          var message = textOf(event && (event.error || event.message));
          if (/SyntaxError|Unexpected token|Unexpected identifier|Invalid regular expression|Unexpected end of script/i.test(message)) {
            show("Navegador desatualizado", OLD_BROWSER_TEXT, message);
            return;
          }
          if (isMissingFile(message)) {
            if (autoRetry()) return;
          }
          failedToStart(message);
        }, true);

        // Safari e o Chrome do iPhone reportam arquivo que nao carregou como
        // promessa rejeitada, nao como erro.
        window.addEventListener("unhandledrejection", function (event) {
          if (appMounted()) return;
          var message = textOf(event && event.reason);
          if (isMissingFile(message) && autoRetry()) return;
          failedToStart(message);
        });

        // Rede final: passou o tempo e nada apareceu na tela.
        window.setTimeout(function () {
          if (appMounted()) return;
          show(
            "O painel está demorando para abrir",
            "A conexão parece lenta neste momento. Ele continua carregando, e assim que terminar esta mensagem some sozinha. " +
              "Se preferir, toque em Tentar novamente."
          );
        }, 20000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
