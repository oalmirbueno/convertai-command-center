name: Alerta de senha errada

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Só simular (não grava aviso no sino)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: alerta-senha-errada
  cancel-in-progress: false

jobs:
  alerta:
    name: Detectar senha errada repetida
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
      MODO: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'dry-run' || 'write' }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Conferir configuração
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]
          test -n "$SUPABASE_ACCESS_TOKEN"
          if [ "$MODO" = "write" ]; then
            test -n "$SUPABASE_DB_PASSWORD"
          fi

      - name: Setup Supabase CLI
        if: env.MODO == 'write'
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Linkar o projeto
        if: env.MODO == 'write'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD" > /dev/null

      - name: Simular alerta
        if: env.MODO == 'dry-run'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/alerta-senha-errada.mjs --dry-run

      - name: Gravar alerta no sino
        if: env.MODO == 'write'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/alerta-senha-errada.mjs --write
