name: Deploy Supabase Database

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character SHA of the current main tip
        required: true
        type: string
      deployment_confirmation:
        description: Confirm the production migration release
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - APPLY_DATABASE_PRODUCTION
      backup_confirmation:
        description: Confirm that the target project has a verified restorable backup
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - BACKUP_VERIFIED
      private_security_confirmation:
        description: Confirm the private production security checklist is complete
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - PRIVATE_SECURITY_CHECKLIST_VERIFIED

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  validate-and-migrate:
    name: Validate and apply forward-only migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout immutable production source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize the exact current main tip
        id: authorization
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          DEPLOYMENT_CONFIRMATION: ${{ inputs.deployment_confirmation }}
          BACKUP_CONFIRMATION: ${{ inputs.backup_confirmation }}
          PRIVATE_SECURITY_CONFIRMATION: ${{ inputs.private_security_confirmation }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          GH_READ_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$DEPLOYMENT_CONFIRMATION" = "APPLY_DATABASE_PRODUCTION"
          test "$BACKUP_CONFIRMATION" = "BACKUP_VERIFIED"
          test "$PRIVATE_SECURITY_CONFIRMATION" = "PRIVATE_SECURITY_CHECKLIST_VERIFIED"
          test "$EVENT_REF" = "refs/heads/main"

          remote_main_sha="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_READ_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq --exit-status --raw-output '.object.sha'
          )"
          checked_out_sha="$(git rev-parse HEAD)"

          test "$EVENT_SHA" = "$remote_main_sha"
          test "$TARGET_SHA" = "$remote_main_sha"
          test "$checked_out_sha" = "$remote_main_sha"
          echo "target_sha=$remote_main_sha" >> "$GITHUB_OUTPUT"

      - name: Verify append-only migration source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e supabase/migrations/20260528163000_legacy_prerequisites.sql
          test -f supabase/bootstrap/legacy_prerequisites.sql
          node scripts/verify-migration-integrity.mjs
          previous_main="$(git rev-parse HEAD^1)"
          node scripts/verify-migration-integrity.mjs --base-ref "$previous_main"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Confirm access token can see the exact project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          project_response="$RUNNER_TEMP/supabase-project.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID" \
            --output "$project_response"
          jq --exit-status --arg project_ref "$SUPABASE_PROJECT_ID" \
            '(.id // .ref // .project_ref) == $project_ref' \
            "$project_response" > /dev/null

      - name: Link the reviewed production project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db push --linked --dry-run

      - name: Apply pending migrations without seed data
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --linked --yes

      - name: Verify migration ledger after release
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db push --linked --dry-run
          mapfile -t expected_migrations < <(
            find supabase/migrations \
              -maxdepth 1 \
              -type f \
              -name '*.sql' \
              -printf '%f\n' \
              | sed -nE 's/^([0-9]{14})_[A-Za-z0-9._-]+\.sql$/\1/p' \
              | sort --unique
          )
          test "${#expected_migrations[@]}" -gt 0
          for version in "${expected_migrations[@]}"; do
            [[ "$version" =~ ^[0-9]{14}$ ]]
          done
          expected_sql="$(printf "'%s'," "${expected_migrations[@]}")"
          expected_sql="${expected_sql%,}"
          ledger_result="$RUNNER_TEMP/database-ledger-current.csv"
          supabase db query --linked \
            --output csv \
            "select case when not exists (
              select expected.version
              from unnest(array[$expected_sql]::text[]) as expected(version)
              left join supabase_migrations.schema_migrations as applied
                on applied.version = expected.version
              where applied.version is null
            ) then 'DATABASE_LEDGER_CURRENT'
            else 'DATABASE_LEDGER_INCOMPLETE'
            end as database_ledger_status;" \
            > "$ledger_result"
          ledger_status="$(
            tr -d '\r' < "$ledger_result" \
              | grep --fixed-strings --line-regexp "DATABASE_LEDGER_CURRENT"
          )"
          test "$ledger_status" = "DATABASE_LEDGER_CURRENT"

      - name: Write release summary
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Supabase database release"
            echo
            echo "- Status: \`$JOB_STATUS\`"
            echo "- Source SHA: \`$TARGET_SHA\`"
            echo "- Strategy: forward-only migrations, no seed, no reset, no repair"
          } >> "$GITHUB_STEP_SUMMARY"
