name: Supabase DB Tests (RLS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-tests:
    name: Supabase local + pgTAP + build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install NPM dependencies
        run: npm ci

      - name: Log Supabase CLI capabilities
        run: |
          supabase --version
          supabase start --help
          supabase db reset --help
          supabase test db --help

      - name: Restore production-only legacy quiz table in CI
        run: |
          cat > supabase/migrations/20260528163000_ci_quiz_submissions_compat.sql <<'SQL'
          CREATE TABLE IF NOT EXISTS public.quiz_submissions (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            submitted_at timestamptz
          );
          ALTER TABLE public.quiz_submissions ENABLE ROW LEVEL SECURITY;
          SQL

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply migrations
        run: supabase db reset --local --no-seed

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Run unit tests
        run: npm test -- --run

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Validate Lovable manifest
        run: npx lovable-mcp-extract-manifest

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup
