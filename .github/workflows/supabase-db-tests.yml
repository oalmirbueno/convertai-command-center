name: Supabase DB Tests (RLS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-tests:
    name: Supabase local + pgTAP + build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_APP_PUBLIC_URL: https://app.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/lovable-mcp-compat/package-lock.json

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Install NPM dependencies
        run: |
          npm install --global npm@11.9.0
          test "$(npm --version)" = "11.9.0"
          npm ci

      - name: Install versioned Lovable MCP compatibility dependencies
        run: npm ci --prefix integrations/lovable-mcp-compat

      - name: Verify append-only migration ledger
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          npm run migrations:verify
          if [[ -n "$PR_BASE_SHA" ]]; then
            node scripts/verify-migration-integrity.mjs --base-ref "$PR_BASE_SHA"
          fi

      # The empty CI database applies the 19 canonical forward migrations. The
      # runner shadow files replay exactly the same SQL under the aliases that
      # production recorded, so they must not run a second time here. The list
      # is derived from the audited manifest, never hardcoded.
      - name: Stage canonical-only migrations for the empty CI database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shadow-migrations"
          node scripts/prepare-production-migration-view.mjs --list-shadow-files \
            > "$RUNNER_TEMP/shadow-migrations/list.txt"
          test -s "$RUNNER_TEMP/shadow-migrations/list.txt"
          while read -r path; do
            test -f "$path"
            mv "$path" "$RUNNER_TEMP/shadow-migrations/$(basename "$path")"
          done < "$RUNNER_TEMP/shadow-migrations/list.txt"

      - name: Log Supabase CLI capabilities
        run: |
          supabase --version
          supabase start --help
          supabase db reset --help
          supabase test db --help

      - name: Restore reviewed legacy prerequisites in empty CI database
        run: |
          cp \
            supabase/bootstrap/legacy_prerequisites.sql \
            supabase/migrations/20260528163000_legacy_prerequisites.sql

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply migrations
        run: supabase db reset --local --no-seed

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Remove CI-only legacy prerequisites migration
        if: always()
        run: |
          if [[ -e supabase/migrations/20260528163000_legacy_prerequisites.sql ]]; then
            unlink supabase/migrations/20260528163000_legacy_prerequisites.sql
          fi

      - name: Restore runner shadow migrations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/shadow-migrations/list.txt"
          if [[ -s "$list" ]]; then
            while read -r path; do
              staged="$RUNNER_TEMP/shadow-migrations/$(basename "$path")"
              if [[ -f "$staged" ]]; then
                mv "$staged" "$path"
              fi
            done < "$list"
          fi
          git diff --quiet -- supabase/migrations


      - name: Run unit tests
        run: npm test -- --run

      - name: Run MCP Deno unit tests
        run: deno test --allow-env supabase/functions/mcp-server/mcp_test.ts

      - name: Type-check portable and public Edge Functions
        run: |
          deno check \
            supabase/functions/admin-reset-client-access/index.ts \
            supabase/functions/api-gateway/index.ts \
            supabase/functions/client-first-access/index.ts \
            supabase/functions/mcp-oauth-metadata/index.ts \
            supabase/functions/mcp-server/index.ts \
            supabase/functions/notify-admin/index.ts \
            supabase/functions/social-meta-oauth/index.ts \
            supabase/functions/submit-quiz/index.ts \
            supabase/functions/workspace-agent/index.ts \
            supabase/functions/workspace-agent-import/index.ts \
            supabase/functions/workspace-inbox/index.ts \
            supabase/functions/workspace-ocr/index.ts

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Validate versioned Lovable MCP compatibility artifacts
        run: |
          npm --prefix integrations/lovable-mcp-compat run verify
          npm --prefix integrations/lovable-mcp-compat run generate
          git diff --exit-code -- \
            .lovable/mcp/manifest.json \
            supabase/functions/mcp/index.ts

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup
