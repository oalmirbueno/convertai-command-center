name: Deploy Supabase Internal Edge

# As 48 funcoes que o Lovable publicava automaticamente e que, fora dele,
# ficariam sem nenhum caminho de release. Mesmo portao dos demais workflows:
# so a ponta de main, SHA conferido contra o remoto e confirmacao digitada.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character SHA of the current main tip
        required: true
        type: string
      release_confirmation:
        description: Confirm the internal Edge production release
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - DEPLOY_INTERNAL_EDGE_PRODUCTION

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and release internal Edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout the current main control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize the exact current main tip
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          GH_READ_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$RELEASE_CONFIRMATION" = "DEPLOY_INTERNAL_EDGE_PRODUCTION"
          test "$EVENT_REF" = "refs/heads/main"

          remote_main_sha="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_READ_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              | jq --exit-status --raw-output '.object.sha'
          )"
          checked_out_sha="$(git rev-parse HEAD)"

          test "$EVENT_SHA" = "$remote_main_sha"
          test "$TARGET_SHA" = "$remote_main_sha"
          test "$checked_out_sha" = "$remote_main_sha"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Install release dependencies
        run: |
          npm install --global npm@11.9.0
          test "$(npm --version)" = "11.9.0"
          npm ci

      - name: Type-check the exact release source
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
          VITE_APP_PUBLIC_URL: https://app.example.com
        run: |
          deno check \
            supabase/functions/auth-email-hook/index.ts \
            supabase/functions/backfill-clients-to-ops/index.ts \
            supabase/functions/backfill-tasks-to-ops/index.ts \
            supabase/functions/backfill-to-ops/index.ts \
            supabase/functions/brain-client-context/index.ts \
            supabase/functions/check-renewals/index.ts \
            supabase/functions/check-task-reminders/index.ts \
            supabase/functions/client-checklist/index.ts \
            supabase/functions/contract-public/index.ts \
            supabase/functions/cycle-brain-log/index.ts \
            supabase/functions/cycle-client-pulse/index.ts \
            supabase/functions/cycle-coach/index.ts \
            supabase/functions/delete-file-assets/index.ts \
            supabase/functions/describe-schema/index.ts \
            supabase/functions/fetch-ops-metrics/index.ts \
            supabase/functions/handle-email-suppression/index.ts \
            supabase/functions/handle-email-unsubscribe/index.ts \
            supabase/functions/journey-narrative/index.ts \
            supabase/functions/manage-team/index.ts \
            supabase/functions/mcp/index.ts \
            supabase/functions/mcp-files-worker/index.ts \
            supabase/functions/notify-admin/index.ts \
            supabase/functions/notify-ops/index.ts \
            supabase/functions/ops-clients-list/index.ts \
            supabase/functions/ops-full-export/index.ts \
            supabase/functions/ops-leads-list/index.ts \
            supabase/functions/ops-projects-list/index.ts \
            supabase/functions/ops-quiz-list/index.ts \
            supabase/functions/ops-quiz-mark-processed/index.ts \
            supabase/functions/ops-tasks-list/index.ts \
            supabase/functions/ops-webhook/index.ts \
            supabase/functions/portal-to-ops/index.ts \
            supabase/functions/preview-transactional-email/index.ts \
            supabase/functions/process-email-queue/index.ts \
            supabase/functions/process-meeting-notes/index.ts \
            supabase/functions/pull-ops-nodes/index.ts \
            supabase/functions/radar-ideas/index.ts \
            supabase/functions/request-task-workflow/index.ts \
            supabase/functions/ritual-writer/index.ts \
            supabase/functions/second-brain-pulse/index.ts \
            supabase/functions/send-contract-email/index.ts \
            supabase/functions/send-transactional-email/index.ts \
            supabase/functions/social-meta-oauth/index.ts \
            supabase/functions/sync-to-ops/index.ts \
            supabase/functions/voice-assistant-agent/index.ts \
            supabase/functions/workspace-agent/index.ts \
            supabase/functions/workspace-agent-import/index.ts \
            supabase/functions/workspace-ocr/index.ts
          git diff --exit-code

      - name: Show deploy tool versions
        run: |
          node --version
          npm --version
          deno --version
          supabase --version

      - name: Confirm access token can see the exact Supabase project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          project_response="$RUNNER_TEMP/supabase-project.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID" \
            --output "$project_response"
          jq --exit-status --arg project_ref "$SUPABASE_PROJECT_ID" \
            '(.id // .ref // .project_ref) == $project_ref' \
            "$project_response" > /dev/null
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" > /dev/null

      - name: Deploy the internal Edge functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy auth-email-hook --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy backfill-clients-to-ops --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy backfill-tasks-to-ops --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy backfill-to-ops --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy brain-client-context --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy check-renewals --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy check-task-reminders --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy client-checklist --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy contract-public --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy cycle-brain-log --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy cycle-client-pulse --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy cycle-coach --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy delete-file-assets --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy describe-schema --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy fetch-ops-metrics --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy handle-email-suppression --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy handle-email-unsubscribe --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy journey-narrative --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy manage-team --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy mcp --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy mcp-files-worker --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy notify-admin --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy notify-ops --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ops-clients-list --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ops-full-export --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ops-leads-list --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ops-projects-list --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ops-quiz-list --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ops-quiz-mark-processed --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ops-tasks-list --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ops-webhook --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy portal-to-ops --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy preview-transactional-email --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy process-email-queue --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy process-meeting-notes --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy pull-ops-nodes --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy radar-ideas --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy request-task-workflow --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ritual-writer --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy second-brain-pulse --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy send-contract-email --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy send-transactional-email --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy social-meta-oauth --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy sync-to-ops --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy voice-assistant-agent --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy workspace-agent --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy workspace-agent-import --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy workspace-ocr --project-ref "$SUPABASE_PROJECT_ID"

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "### Internal Edge release"
            echo
            echo "- project: \`$SUPABASE_PROJECT_ID\`"
            echo "- functions deployed: 48"
          } >> "$GITHUB_STEP_SUMMARY"
